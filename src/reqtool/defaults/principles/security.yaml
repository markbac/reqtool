area: security
label: Security
code: SEC
description: Product security, identity, cryptographic controls, vulnerability management,
  and supply chain.
categories:
- id: general
  label: General
  code: GEN
- id: identity
  label: Identity and credentials
  code: ID
- id: cryptography
  label: Cryptography
  code: CRY
