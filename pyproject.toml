[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqtool"
version = "0.6.0"
description = "Git-backed YAML requirements management tool for engineering programmes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Mark Bacon" },
]
keywords = ["requirements", "systems-engineering", "agile", "git", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "ruamel.yaml.clib>=0.2.8; platform_python_implementation == 'CPython' and python_version < '3.14'",
    "watchdog>=4.0",
    "click>=8.1",
    "httpx>=0.27",
    "markdown>=3.5",
    "websockets>=12.0",
    "reportlab>=4.0",
    "defusedxml>=0.7",
    "nh3>=0.2.14",
    "PyJWT>=2.8",
]

[project.scripts]
req = "reqtool.cli:cli"
reqtool = "reqtool.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "pypdf>=4.0",
    "fonttools>=4.40",
]
lint = [
    "ruff",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reqtool = [
    "defaults/*.yaml",
    "defaults/.vale.ini",
    "defaults/styles/INCOSE/*.yml",
    "defaults/fonts/*",
    "ui/dist/index.html",
    "ui/dist/assets/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
# Subsets for faster local runs:
#   pytest tests/test_store.py tests/test_validation.py tests/test_cli.py   (~20s)
#   pytest tests/test_features_v03.py                                        (~30s)
#   pytest tests/test_api.py tests/test_regression.py                        (~2 min)

[tool.mypy]
python_version = "3.11"
files = ["src/reqtool"]
ignore_missing_imports = true
warn_unused_ignores = true

# Legacy modules with known type errors. Remove an entry once its module is clean;
# every other module is held to a clean mypy run in CI.
[[tool.mypy.overrides]]
module = [
    "reqtool.__main_app__", "reqtool.__main_client__", "reqtool.__main_server__", "reqtool.__main_web__",
    "reqtool.api", "reqtool.commands.scaffold", "reqtool.exports", "reqtool.store",
    "reqtool.stores.hierarchy_store", "reqtool.stores.comment_store", "reqtool.validation",
    "reqtool.routers.comments", "reqtool.routers.deps", "reqtool.routers.exports",
    "reqtool.routers.imports", "reqtool.routers.requirements", "reqtool.routers.system",
    "reqtool.automation",
]
ignore_errors = true

[tool.importlinter]
root_package = "reqtool"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core modules do not import the web layer"
type = "forbidden"
source_modules = [
    "reqtool.store", "reqtool.stores", "reqtool.models", "reqtool.validation", "reqtool.fileio",
    "reqtool.git_ops", "reqtool.events", "reqtool.automation", "reqtool.iterations",
    "reqtool.github_sync", "reqtool.pdf", "reqtool.exports", "reqtool.intelligence",
]
forbidden_modules = ["reqtool.routers", "reqtool.api", "reqtool.security", "fastapi", "starlette"]
