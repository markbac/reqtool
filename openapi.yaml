webhooks:
  requirement_created:
    post:
      summary: Outbound event fired when a requirement is created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: requirement_created
                repo_id:
                  type: string
                payload:
                  type: object
                  properties:
                    uid:
                      type: string
                    id:
                      type: string
                    title:
                      type: string
      responses:
        '200':
          description: Webhook acknowledged
  requirement_updated:
    post:
      summary: Outbound event fired when a requirement is updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: requirement_updated
                repo_id:
                  type: string
                payload:
                  type: object
                  properties:
                    uid:
                      type: string
                    id:
                      type: string
      responses:
        '200':
          description: Webhook acknowledged
  requirement_approved:
    post:
      summary: Outbound event fired when a requirement is approved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: requirement_approved
                repo_id:
                  type: string
                payload:
                  type: object
                  properties:
                    uid:
                      type: string
                    approved_by:
                      type: string
      responses:
        '200':
          description: Webhook acknowledged
  attachment_added:
    post:
      summary: Outbound event fired when a file attachment is uploaded
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: attachment_added
                repo_id:
                  type: string
                payload:
                  type: object
                  properties:
                    uid:
                      type: string
                    filename:
                      type: string
      responses:
        '200':
          description: Webhook acknowledged
  comment_added:
    post:
      summary: Outbound event fired when a discussion comment is posted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: comment_added
                repo_id:
                  type: string
                payload:
                  type: object
                  properties:
                    uid:
                      type: string
                    comment_uid:
                      type: string
      responses:
        '200':
          description: Webhook acknowledged
