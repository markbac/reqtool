openapi: 3.1.0
info:
  title: reqtool
  description: Git-backed YAML requirements management tool. Requirements, principles, and TBDs live as individual YAML 
    files; the API handles hashing, versioning, validation, and export.
  contact:
    name: reqtool
  license:
    name: MIT
  version: 0.1.0
paths:
  /requirements:
    get:
      summary: List Requirements
      operationId: list_requirements_requirements_get
      parameters:
      - name: product
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Product
      - name: domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
      - name: status
        in: query
        required: false
