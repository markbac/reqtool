openapi: 3.1.0
info:
  title: reqtool
  description: Git-backed YAML requirements management tool. Requirements, principles, and TBDs live as individual YAML 
    files; the API handles hashing, versioning, validation, and export.
  version: 0.6.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /permissions:
    get:
      tags:
      - meta
      summary: Get Permissions
      description: What the caller may do. In local mode the single user on this machine is an administrator.
      operationId: get_permissions_permissions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /version:
    get:
