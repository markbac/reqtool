      description: Check every item. ``severity`` is the least serious level to include.
      operationId: lint_all_lint_get
      parameters:
      - name: severity
        in: query
        required: false
        schema:
          enum:
          - error
          - warning
          - info
          type: string
          default: info
          title: Severity
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
