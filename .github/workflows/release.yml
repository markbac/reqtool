name: Release & Publishing Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # A tag only publishes if the full CI suite (lint, every test file on every Python, UI tests,
  # wheel contents) passes on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-python-packages:
    name: Build Wheel & Source Package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js & Build UI Assets
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd src/reqtool/ui
          npm ci
          npm run build

      # Nothing is uploaded to a package index: only the GitHub Release below is published.
      # twine is used to validate the package metadata only.
      - name: Install Build Tools
        run: pip install build twine

      - name: Build Python Package (.whl & .tar.gz)
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Install the wheel and smoke-test it (server, UI, PDF and ReqIF export)
        run: |
          pip install dist/*.whl
          reqtool --help
          python scripts/smoke_release.py reqtool

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-documentation-bundle:
    name: Package Documentation & User Guide
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF Generation Tools & Package
        run: pip install reportlab markdown pydantic click -e .

      - name: Generate PDF User Guide & Demo Specification Example
        run: |
          python scripts/generate_pdf_guide.py
          python scripts/create_demo_repo.py --out-dir ./demo-iot-repo
          cp demo-iot-repo/exports/demo-iot-sensor-specification.pdf reqtool-demo-iot-sensor-specification.pdf

      - name: Package Documentation Archive
        run: |
          mkdir -p docs-dist/docs
          cp README.md ARCHITECTURE.md LICENSE reqtool-user-guide.pdf reqtool-demo-iot-sensor-specification.pdf docs-dist/
          cp docs/*.md docs-dist/docs/
          cd docs-dist
          zip -r ../reqtool-documentation-and-user-guide.zip .

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-dist
          path: |
            reqtool-documentation-and-user-guide.zip
            reqtool-user-guide.pdf
            reqtool-demo-iot-sensor-specification.pdf

  build-standalone-binaries:
    name: Build Standalone Binary Executables (${{ matrix.os }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: .exe
            platform: windows-amd64
          - os: ubuntu-latest
            suffix: ""
            platform: linux-amd64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js & Build UI Assets
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd src/reqtool/ui
          npm ci
          npm run build

      - name: Install PyInstaller & Dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Executables
        run: pyinstaller reqtool.spec --clean

      - name: Smoke-test the standalone CLI binary (server, UI, PDF and ReqIF export)
        shell: bash
        run: python scripts/smoke_release.py dist/reqtool${{ matrix.suffix }}

      - name: Package & Rename Executable Artifacts
        shell: bash
        run: |
          mkdir -p release-binaries
          cp dist/reqtool-web${{ matrix.suffix }} release-binaries/reqtool-web-${{ matrix.platform }}${{ matrix.suffix }}
          cp dist/reqtool-app${{ matrix.suffix }} release-binaries/reqtool-app-${{ matrix.platform }}${{ matrix.suffix }}
          cp dist/reqtool-server${{ matrix.suffix }} release-binaries/reqtool-server-${{ matrix.platform }}${{ matrix.suffix }}
          cp dist/reqtool-client${{ matrix.suffix }} release-binaries/reqtool-client-${{ matrix.platform }}${{ matrix.suffix }}
          cp dist/reqtool${{ matrix.suffix }} release-binaries/reqtool-cli-${{ matrix.platform }}${{ matrix.suffix }}

      - name: Upload Standalone Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: release-binaries/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-python-packages, build-documentation-bundle, build-standalone-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Release Assets Directory
        run: |
          mkdir -p final-dist
          # Refuse to overwrite: two artifacts with the same file name would silently lose one.
          find release-assets/ -type f | while read -r f; do
            name=$(basename "$f")
            if [ -e "final-dist/$name" ]; then echo "ERROR: duplicate release asset name: $name"; exit 1; fi
            cp "$f" "final-dist/$name"
          done
          ls -la final-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-pages:
    name: Build & Deploy Documentation to GitHub Pages
    needs: publish-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Documentation Dependencies
        run: pip install markdown pyyaml reportlab

      - name: Build Static Documentation Portal & OpenAPI Spec
        run: python scripts/build_docs.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
