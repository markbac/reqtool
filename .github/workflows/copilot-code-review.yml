name: Automated PR Code Review & Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    name: Automated PR Code Review & Linter Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Vale Linter
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.9.5/vale_3.9.5_Linux_64-bit.tar.gz
          tar -xzf vale_3.9.5_Linux_64-bit.tar.gz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Install reqtool Package
        run: pip install -e ".[test]"

      - name: Run Test Suite
        id: tests
        run: pytest -q --timeout=60

      - name: Validate a freshly initialised demo repository
        id: validate
        run: |
          mkdir /tmp/demo-repo && cd /tmp/demo-repo
          git init -q
          git config user.email "ci@reqtool"
          git config user.name  "reqtool CI"
          req init demo --repo .
          req validate --repo .

      - name: Comment PR Review Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TESTS: ${{ steps.tests.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        with:
          script: |
            const icon = (o) => o === 'success' ? '✅ Passed' : o === 'skipped' ? '⏭️ Skipped' : '❌ ' + o;
            const body = `## Automated PR check summary

            - **Test suite:** ${icon(process.env.TESTS)}
            - **Demo repository validation:** ${icon(process.env.VALIDATE)}

            Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
