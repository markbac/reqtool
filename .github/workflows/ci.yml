name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_call:   # the release workflow runs this same suite before it builds anything

# Cancel in-flight runs for the same branch/PR so a fast-follow commit
# doesn't queue behind a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: import, lint, type hints
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & import check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package (no test extras)
        run: pip install -e "."

      - name: Static errors (undefined names, syntax errors, invalid comparisons)
        run: |
          pip install ruff
          ruff check src tests --select E9,F63,F7,F82

      - name: Type check (mypy) and import boundaries (import-linter)
        run: |
          pip install mypy import-linter types-PyYAML
          mypy
          lint-imports

      - name: Verify all modules import cleanly
        run: |
          python -c "from reqtool.models   import HierarchyConfig, Requirement, ChecklistItem"
          python -c "from reqtool.store    import Store"
          python -c "from reqtool.api      import create_app"
          python -c "from reqtool.cli      import cli"
          python -c "from reqtool.exports  import export_csv, export_jsx"
          python -c "from reqtool.validation import validate_all"

      - name: Check hierarchy.yaml and help.yaml ship with the package
        run: |
          python - <<'EOF'
          from pathlib import Path
          defaults = Path("src/reqtool/defaults")
          for name in ("hierarchy.yaml", "help.yaml", "enums.yaml",
                       "workflow.yaml", "templates.yaml"):
              assert (defaults / name).exists(), f"Missing default: {name}"
          assert list((defaults / "principles").glob("*.yaml")), "Missing default principle packs"
          print("All defaults present.")
          EOF

      - name: Verify OpenAPI schema version matches package version
        run: |
          python -c "from reqtool import __version__; from reqtool.api import create_app; from pathlib import Path; app = create_app(Path.cwd()); assert app.openapi()['info']['version'] == __version__; print('OpenAPI version verified.')"

  # ---------------------------------------------------------------------------
  # Tests: latest Python only (cost)
  # Three parallel jobs, each running a distinct subset to keep each job
  # under ~3 minutes.
  # ---------------------------------------------------------------------------
  test-core:
    name: "Tests / core (py${{ matrix.python-version }})"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: pip install -e ".[test]"

      # Every test file runs somewhere (QA-01): this job takes the unit and acceptance tiers, the next two take
      # the integration tier, so a new test file is picked up automatically.
      - name: Run core tests (unit and acceptance tiers)
        run: |
          pytest tests/unit tests/acceptance \
            --timeout=60 \
            -v \
            --tb=short \
            --junit-xml=junit-core-${{ matrix.python-version }}.xml

      - name: Report failed tests
        if: failure()
        run: python scripts/ci_failures.py junit-core-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-core-py${{ matrix.python-version }}
          path: junit-core-${{ matrix.python-version }}.xml

  test-features:
    name: "Tests / v0.3.0 features (py${{ matrix.python-version }})"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: pip install -e ".[test]"

      - name: Run integration tests (everything but the API and regression files)
        run: |
          pytest tests/integration \
            --ignore=tests/integration/test_api.py \
            --ignore=tests/integration/test_regression.py \
            --timeout=60 \
            -v \
            --tb=short \
            --junit-xml=junit-features-${{ matrix.python-version }}.xml

      - name: Report failed tests
        if: failure()
        run: python scripts/ci_failures.py junit-features-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-features-py${{ matrix.python-version }}
          path: junit-features-${{ matrix.python-version }}.xml

  test-api:
    name: "Tests / API & regression (py${{ matrix.python-version }})"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: pip install -e ".[test]"

      - name: Run API and regression tests
        run: |
          pytest \
            tests/integration/test_api.py \
            tests/integration/test_regression.py \
            --timeout=60 \
            -v \
            --tb=short \
            --junit-xml=junit-api-${{ matrix.python-version }}.xml
        timeout-minutes: 10

      - name: Report failed tests
        if: failure()
        run: python scripts/ci_failures.py junit-api-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api-py${{ matrix.python-version }}
          path: junit-api-${{ matrix.python-version }}.xml

  # ---------------------------------------------------------------------------
  # Validation smoke-test: req validate runs cleanly on the demo dataset
  # ---------------------------------------------------------------------------
  validate-demo:
    name: Validation smoke-test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: pip install -e "."

      - name: Initialise demo repository and run req validate
        run: |
          mkdir demo-repo && cd demo-repo
          git init -q
          git config user.email "ci@reqtool"
          git config user.name  "reqtool CI"
          req init demo --repo .
          req validate --repo .

  # ---------------------------------------------------------------------------
  # Hash verification: req verify passes on a freshly initialised repo
  # ---------------------------------------------------------------------------
  verify-hashes:
    name: Hash verification
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: pip install -e "."

      - name: req verify passes on a clean repo
        run: |
          mkdir verify-repo && cd verify-repo
          git init -q
          git config user.email "ci@reqtool"
          git config user.name  "reqtool CI"
          req init defaults --repo . --id verify-test --title "Verify Test"
          req verify --repo .

  # ---------------------------------------------------------------------------
  # UI: build, test, and keep the build for the wheel job (dist/ is not committed)
  # ---------------------------------------------------------------------------
  ui-build:
    name: UI build check
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/reqtool/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/reqtool/ui
        run: npm install --legacy-peer-deps

      - name: Build UI
        working-directory: src/reqtool/ui
        run: npm run build

      - name: Run UI tests
        working-directory: src/reqtool/ui
        run: npm test

      - name: Check the build produced the UI entry point
        run: |
          test -f src/reqtool/ui/dist/index.html || { echo "ERROR: UI build produced no dist/index.html"; exit 1; }
          ls src/reqtool/ui/dist/assets | head

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/reqtool/ui/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Browser tests (QA-02): the built UI in Chromium against a real `req serve`
  # ---------------------------------------------------------------------------
  e2e:
    name: Browser tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/reqtool/ui/package-lock.json

      - name: Build the UI
        working-directory: src/reqtool/ui
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install package, test and browser extras
        run: pip install -e ".[test,e2e]"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # REQTOOL_E2E_REQUIRED turns a missing browser or UI build into a failure instead of a skip.
      - name: Run browser tests
        run: REQTOOL_E2E_REQUIRED=1 pytest tests/e2e --timeout=120 -v --tb=short

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build: confirm the wheel builds and installs cleanly
  # ---------------------------------------------------------------------------
  build:
    name: Build wheel
    needs: [test-core, test-features, test-api, ui-build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch the built UI (dist/ is git-ignored, so the wheel needs it from the UI job)
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/reqtool/ui/dist

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - name: Wheel must contain the UI
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "reqtool/ui/dist/index.html" in names, "wheel has no UI (reqtool/ui/dist/index.html)"
          assert any(n.startswith("reqtool/ui/dist/assets/") for n in names), "wheel has no UI assets"
          assert any(n.startswith("reqtool/defaults/fonts/") for n in names), "wheel has no bundled fonts"
          print("wheel contains the UI and fonts")
          EOF

      - name: Install from wheel and smoke-test
        run: |
          pip install dist/*.whl
          python -c "import reqtool; print('reqtool', reqtool.__version__)"
          req --help

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: reqtool-wheel
          path: dist/*.whl
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Dependency audit: informational. An advisory published against a dependency should be visible
  # but must not block unrelated pull requests, so failures do not fail the run.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (informational)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit
        run: |
          pip install -e "." pip-audit
          pip-audit --skip-editable --progress-spinner off

      - name: npm audit (production dependencies)
        working-directory: src/reqtool/ui
        run: npm audit --omit=dev --audit-level=high
